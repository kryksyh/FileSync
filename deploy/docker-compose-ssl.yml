services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: filesync-caddy
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - filesync:/data
    depends_on:
      - filesync
      - coturn
    restart: unless-stopped

  filesync:
    image: poliuscorp/filesync
    container_name: filesync-app
    environment:
      - SECRET_KEY=<SECRET_KEY>
    depends_on:
      - peerjs
    restart: unless-stopped

  peerjs:
    image: peerjs/peerjs-server:1.1.0-rc.2
    container_name: filesync-peerjs
    command: peerjs --path /peerjs
    restart: unless-stopped

  coturn:
    image: coturn/coturn:alpine
    container_name: filesync-coturn
    # No ports published: TLS is terminated by Caddy on :443 and the plain
    # TURN/TCP traffic is proxied to coturn over the docker network. coturn
    # forwards data between the two TURN allocations internally, so no UDP
    # relay traffic ever needs to leave the host.
    command:
      - --listening-port=3478
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=<SECRET_KEY>
      - --realm=yourdomain.com
    restart: unless-stopped

volumes:
  filesync:
